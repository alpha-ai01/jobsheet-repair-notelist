<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="SmartRepair - แพลตฟอร์มจัดการงานซ่อมครบวงจร">

    <title>SmartRepair Platform</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: '#0f172a',
                        slate: '#1e293b',
                        accent: '#f97316', // Orange
                        cyan: '#06b6d4', // Cyan
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="min-h-screen">

    <!-- HEADER -->
    <header class="glass sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-black text-white">Smart <span class="text-accent">Repair</span></h1>
                <p class="text-[10px] text-cyan-400 uppercase tracking-widest">Repair Management Platform</p>
            </div>
            <div class="flex items-center gap-3">
                <button class="text-xs font-semibold px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg">Guest Access</button>
                <button class="text-xs font-semibold px-4 py-2 bg-accent hover:bg-orange-600 rounded-lg">Login</button>
            </div>
        </div>
    </header>

    <!-- TOP BANNER AD -->
    <div class="max-w-7xl mx-auto px-4 py-4">
        <div class="h-24 bg-slate-800 rounded-2xl flex items-center justify-center text-slate-500 border border-slate-700 border-dashed">
            [Top Banner Ad Slot]
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- FEED -->
        <section class="lg:col-span-3 space-y-6">
            <h2 class="text-xl font-bold">Latest Repairs</h2>
            <div id="repair_feed" class="space-y-4">
                <!-- Repair Job Cards -->
                <div class="glass p-5 rounded-2xl">
                    <div class="flex gap-4">
                        <div class="w-20 h-20 bg-slate-700 rounded-xl"></div>
                        <div class="flex-1">
                            <h3 class="font-bold">iPhone 15 Pro Max</h3>
                            <p class="text-xs text-slate-400">Status: Repairing</p>
                        </div>
                    </div>
                </div>
                <!-- Native In-Feed Ad -->
                <div class="h-20 bg-slate-800/50 rounded-2xl flex items-center justify-center text-slate-500 border border-slate-700">
                    [Native In-Feed Ad]
                </div>
            </div>
        </section>

        <!-- SIDEBAR -->
        <aside class="hidden lg:block space-y-6">
            <div class="glass p-5 rounded-2xl h-96 flex items-center justify-center text-slate-500 border border-slate-700">
                [Side Ad Panel]
            </div>
        </aside>
    </main>

    <script type="module" src="src/app/bootstrap.js"></script>
</body>
</html>
